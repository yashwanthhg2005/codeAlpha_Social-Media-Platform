<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home / Feed - Connectly</title>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header></header>

  <!-- Main Content Grid -->
  <main class="container">
    <div class="main-layout">
      
      <!-- Left Sidebar (Current User Info) -->
      <aside class="left-sidebar">
        <div class="sidebar-card sidebar-profile">
          <img src="" class="sidebar-profile-cover" id="side-cover" alt="Cover">
          <img src="" class="sidebar-profile-avatar" id="side-avatar" alt="Avatar">
          <h3 class="sidebar-profile-name" id="side-name">Loading...</h3>
          <span class="sidebar-profile-handle" id="side-handle">@handle</span>
          
          <div class="sidebar-profile-stats">
            <div class="stat-item">
              <span class="stat-val" id="side-stat-posts">0</span>
              <span class="stat-lbl">Posts</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" id="side-stat-followers">0</span>
              <span class="stat-lbl">Followers</span>
            </div>
            <div class="stat-item">
              <span class="stat-val" id="side-stat-following">0</span>
              <span class="stat-lbl">Following</span>
            </div>
          </div>
        </div>

        <!-- Sidebar Navigation List -->
        <div class="sidebar-card" style="padding: 10px;">
          <ul class="sidebar-nav-list">
            <li class="sidebar-nav-item active">
              <a href="./index.html"><i class="fas fa-home"></i> Home Feed</a>
            </li>
            <li class="sidebar-nav-item">
              <a href="./explore.html"><i class="fas fa-compass"></i> Explore</a>
            </li>
            <li class="sidebar-nav-item">
              <a href="./notifications.html"><i class="fas fa-bell"></i> Notifications</a>
            </li>
            <li class="sidebar-nav-item" id="side-nav-profile-link">
              <a href=""><i class="fas fa-user"></i> My Profile</a>
            </li>
          </ul>
        </div>
      </aside>

      <!-- Central Feed -->
      <section class="feed-content">
        <!-- Stories (Horizontal view of demo users) -->
        <div class="stories-container" id="stories-wrapper"></div>

        <!-- Create Post Card Trigger -->
        <div class="create-post-quick">
          <img src="" id="quick-avatar" alt="Avatar">
          <div class="create-post-input-box" onclick="window.location.href='./create-post.html'">
            What's on your mind? Share a story, post, or photo...
          </div>
          <div class="create-post-actions-row">
            <button class="create-post-btn-icon" onclick="window.location.href='./create-post.html?type=image'" title="Add Image">
              <i class="far fa-image"></i>
            </button>
          </div>
        </div>

        <!-- Main Feed Posts container -->
        <div class="feed-content" id="feed-container"></div>
      </section>

      <!-- Right Sidebar (Suggestions & Categories) -->
      <aside class="right-sidebar">
        <!-- Follow Suggestions widget -->
        <div class="sidebar-card">
          <h3 class="widget-title">Who to Follow</h3>
          <div class="suggestion-list" id="suggestions-container"></div>
        </div>

        <!-- Popular categories list -->
        <div class="sidebar-card">
          <h3 class="widget-title">Trending Categories</h3>
          <div style="display: flex; flex-direction: column; gap: 8px;" id="trending-categories-list">
            <a href="./explore.html?category=Technology" class="btn-secondary" style="text-align: left; padding: 10px 14px; font-size: 0.85rem;"><i class="fas fa-hashtag" style="color: var(--accent);"></i> Technology</a>
            <a href="./explore.html?category=Travel" class="btn-secondary" style="text-align: left; padding: 10px 14px; font-size: 0.85rem;"><i class="fas fa-hashtag" style="color: var(--accent);"></i> Travel</a>
            <a href="./explore.html?category=Design" class="btn-secondary" style="text-align: left; padding: 10px 14px; font-size: 0.85rem;"><i class="fas fa-hashtag" style="color: var(--accent);"></i> Design</a>
            <a href="./explore.html?category=Lifestyle" class="btn-secondary" style="text-align: left; padding: 10px 14px; font-size: 0.85rem;"><i class="fas fa-hashtag" style="color: var(--accent);"></i> Lifestyle</a>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <!-- Scripts -->
  <script src="./js/data.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/posts.js"></script>
  <script>
    // Route guard: must be authenticated
    const currentUser = window.ConnectlyAuth.checkAuth();

    if (currentUser) {
      const db = window.ConnectlyDB;
      const allUsers = db.getUsers() || [];
      const allPosts = db.getPosts() || [];
      const followers = db.getFollowers() || [];

      // 1. Populate Left Sidebar details
      document.getElementById("side-cover").src = currentUser.cover || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80";
      document.getElementById("side-avatar").src = currentUser.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80";
      document.getElementById("side-name").textContent = currentUser.name;
      document.getElementById("side-handle").textContent = `@${currentUser.username}`;
      document.getElementById("quick-avatar").src = currentUser.avatar;

      // Update stat counters in Left Sidebar
      const userPostsCount = allPosts.filter(p => p.userId === currentUser.id).length;
      const userFollowersCount = followers.filter(f => f.followingId === currentUser.id).length;
      const userFollowingCount = followers.filter(f => f.followerId === currentUser.id).length;
      
      document.getElementById("side-stat-posts").textContent = userPostsCount;
      document.getElementById("side-stat-followers").textContent = userFollowersCount;
      document.getElementById("side-stat-following").textContent = userFollowingCount;

      // Update profile link
      document.querySelector("#side-nav-profile-link a").href = `./profile.html?username=${currentUser.username}`;

      // 2. Render Stories List
      const storiesContainer = document.getElementById("stories-wrapper");
      const storyUsers = allUsers.filter(u => u.id !== currentUser.id);
      
      storiesContainer.innerHTML = storyUsers.map(user => `
        <div class="story-card" onclick="window.location.href='./profile.html?username=${user.username}'" style="cursor: pointer;">
          <div class="story-avatar-wrapper">
            <img src="${user.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" class="story-avatar" alt="${user.name}">
          </div>
          <span class="story-name">${user.name.split(' ')[0]}</span>
        </div>
      `).join("");

      // 3. Render Main Feed Posts
      window.ConnectlyPosts.renderFeed(allPosts, "feed-container");

      // 4. Render Sidebar Follow Suggestions
      const suggestionsContainer = document.getElementById("suggestions-container");
      // Find users not followed yet by currentUser
      const followedIds = followers
        .filter(f => f.followerId === currentUser.id)
        .map(f => f.followingId);
      
      const suggestedUsers = allUsers.filter(u => u.id !== currentUser.id && !followedIds.includes(u.id));

      if (suggestedUsers.length === 0) {
        suggestionsContainer.innerHTML = `<p style="font-size: 0.85rem; color: var(--text-secondary);">No new suggested users</p>`;
      } else {
        suggestionsContainer.innerHTML = suggestedUsers.slice(0, 5).map(user => `
          <div class="suggestion-item">
            <a href="./profile.html?username=${user.username}" class="user-snippet">
              <img src="${user.avatar}" alt="${user.name}">
              <div class="user-snippet-info">
                <span class="user-snippet-name">${user.name}</span>
                <span class="user-snippet-handle">@${user.username}</span>
              </div>
            </a>
            <button class="btn-follow-sm btn-suggest-follow" data-author-id="${user.id}">Follow</button>
          </div>
        `).join("");

        // Bind suggest-follow actions
        suggestionsContainer.querySelectorAll(".btn-suggest-follow").forEach(btn => {
          btn.addEventListener("click", () => {
            const authorId = btn.getAttribute("data-author-id");
            window.ConnectlyPosts.toggleFollow(authorId, btn);
            // Refresh counts in sidebar after follow toggled
            setTimeout(() => {
              const freshFollowers = db.getFollowers() || [];
              const followingCount = freshFollowers.filter(f => f.followerId === currentUser.id).length;
              document.getElementById("side-stat-following").textContent = followingCount;
            }, 200);
          });
        });
      }
    }
  </script>
</body>
</html>
